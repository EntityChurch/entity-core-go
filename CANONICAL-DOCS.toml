# ── Area declarations (2026-09 doc standard) ─────────────────────────────────
# Tell the checks what each directory IS, rather than leaving them to a hardcoded
# idea of where docs live. Undeclared prose under a doc dir is dropped at a cut;
# these areas scope dated/internal trees correctly so a right-organised tree is
# not flagged and internal material is not published.

[[area]]
path      = "docs/status"
kind      = "status"      # dated HANDOFF/CHECKPOINT/STATUS snapshots — working memory, ages out
publishes = false

[[area]]
path      = "docs/outbox"
kind      = "outbox"      # routing packets we have SENT — internal, never published
publishes = false

[[area]]
path      = "docs/reviews"
kind      = "status"      # dated audits/reviews — internal working record
publishes = false

[[area]]
path      = "docs/validation/reports"
kind      = "status"      # dated conformance/validation reports — internal
publishes = false

[[area]]
path      = "docs/validation/spec-issues"
kind      = "status"      # dated spec-ambiguity write-ups routed upstream — internal
publishes = false

[[area]]
path      = "docs/agents/memory"
kind      = "memory"      # durable, indexed engineering memory — publishes
publishes = true

# The counterpart trackers are durable and edited in place, but must NEVER
# publish — routing is internal. This is the case that had no honest answer
# before: the only way to silence the nag used to be "declare it canonical",
# which publishes it.
[[living]]
glob     = "docs/status/TRACKER-*.md"
internal = true

